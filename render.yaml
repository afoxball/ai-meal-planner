# Render deployment configuration
databases:
  - name: meal-planner-db
    databaseName: meal_planner
    user: meal_planner_user
    plan: free

services:
  - type: web
    name: ai-meal-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meal-planner-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.6
